[[param]]
name = "vdhe"
length = 1
min = 0
max = 2
frac_bits = 0
default = [0]
label = "Dolby Headphone Virtualizer Control"
description = "Specifies the preferential enable for the Dolby Headphone feature."
help = """
- DAP_FEATURE_OFF will disable Dolby Headphone.
- DAP_FEATURE_ON will enable Dolby Headphone if it is part of this SKU.
- DAP_FEATURE_AUTO will enable Dolby Headphone if no other virtualizer has been forcefully enabled and the endpoint is DAP_ENDP_HEADPHONES and it is part of this SKU.
Note that setting both the 'vdhe' and 'vspe' parameters to DAP_FEATURE_ON represents an invalid configuration and will cause neither virtualizer to be enabled."""

[[param]]
name = "vspe"
length = 1
min = 0
max = 2
frac_bits = 0
default = [0]
label = "Dolby Virtual Speaker Virtualizer Control"
description = "Specifies the preferential enable for the Dolby Virtual Speaker feature."
help = """
- DAP_FEATURE_OFF will disable Dolby Virtual Speaker.
- DAP_FEATURE_ON will enable Dolby Virtual Speaker if it is part of this SKU.
- DAP_FEATURE_AUTO will enable Dolby Virtual Speaker if no other virtualizer has been forcefully enabled and the endpoint is DAP_ENDP_INT_SPEAKERS and it is part of this SKU.
Note that setting both the 'vdhe' and 'vspe' parameters to DAP_FEATURE_ON represents an invalid configuration and will cause neither virtualizer to be enabled. Also if the Output Channel Format is set to DAP_OCF_7DOT1, virtual speaker virtualizer is always off."""

