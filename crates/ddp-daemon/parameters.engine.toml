label = "Dolby Volume Leveler Enable"
description = "Specifies the preferential enable for the Dolby Volume Leveler feature."
help = "The Dolby Volume leveler, reduces the loud parts of the audio, and increases the quiet parts, to enhance the listening experience for non-ideal listening environments, while maintaining the expected dynamics of the signal.The Dolby Volume Leveler is active when this parameteris set to DAP_FEATURE_ON and it is part of this SKU."

[[param]]
name = "dvmc"
length = 1
min = -320
max = 320
frac_bits = 4
default = [0]
label = "Dolby Volume Modeler Calibration"
description = "Use this parameter to fine-tune the manufacturer calibrated reference level to the listening environment."
help = "This input parameter allows end users to adjust for variables such as listening positions or differing speaker sensitivities. For example, the end user of an A/V receiver (AVR) with Dolby Volume can recalibrate an AVR to optimize the reference level for the user's actual listening position."

[[param]]
