label = "Dolby Volume Leveler Input Target"
description = "Sets the target average loudness level of the Dolby Volume Leveler."
help = "Dolby Volume will level the audio to the average loudness level specified by the Leveler Input Target. The level is specified according to a K loudness weighting."

[[param]]
