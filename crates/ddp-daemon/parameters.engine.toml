help = "The Dolby Volume Modeler, provides calibrated spectral shaping of the audio, to compensate for the differences between your current playback level, and the mastering loudness levels at time of recording.The Dolby Volume Modeler is active when this parameter is set to DAP_FEATURE_ON and it is part of this SKU.NB The Dolby Volume Modeler feature should NOT be used in system integrations where the user's volume control applies it's gain after the Audio Processing Platform."

