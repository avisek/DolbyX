# parameters.engine.toml — probe-generated engine-fact twin of
# parameters.toml. DO NOT HAND-EDIT; regenerate with `just param-twin`.
# Never loaded by the daemon: CI diffs the engine-fact fields
# (name length min max frac_bits default) against parameters.toml and
# fails on drift (ADR-0004). label/description/help are the engine's own
# strings, kept as the seeding reference — not diffed.

[[param]]
name = "bver"
length = 5
min = -32768
max = 32767
frac_bits = 0
default = [4, 28, 9, 0, 0]
label = "Bundle version"
description = "Identifies the version of the bundle as a combination of versions of all objects."
help = """
This parameter is automatically calculated as the sum of the versions of all objects in the bundle and is intended as a way to uniquely identify the bundle, in conjunction with the bndl parameter.
- Note: The return type of the bver parameter is always AK_DATATYPE_SHORT. Calling ak_get_bulk() with the return type set to any other type will result in AK_ERR_DATATYPE being returned."""

[[param]]
name = "ver"
length = 4
min = -32768
max = 32767
frac_bits = 0
default = [2, 0, 4, 0]
label = "Version"
description = "Version number of this object."
help = ""

[[param]]
name = "bndl"
length = 2
min = -32768
max = 32767
frac_bits = 0
default = [16708, 80]
label = "Bundle id"
description = "Identifies the bundle."
help = "This can be turned into a four character name using the ak_ints_to_name() function"

[[param]]
name = "endp"
length = 1
min = 0
max = 6
frac_bits = 0
default = [0]
label = "Endpoint"
