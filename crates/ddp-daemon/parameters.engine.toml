label = "Peak Limiter Boost"
description = "Specifies a limited gain to be applied to the signal."
help = "The limiter will apply this maximum gain if the resulting signal is less than the allowed peak level."

[[param]]
name = "plmd"
length = 1
min = 0
max = 4
frac_bits = 0
default = [4]
label = "Peak Limiting and Protection Mode"
description = "Controls the state of the Peak Limiter and Audio Regulator."
help = """
The Audio Processing Platform contains two features that allow protection of the audio signal at high levels from clipping and other distortions. The peak limiter is used to prevent clipping due to peaks in the audio caused by the Audio Processing Platform features. While the Audio Regulator is designed to allow the user to maximize the loudness of the system while minimizing the distortions created by loudspeakers and other components of the system.
There are four settings the Peak Limiting and Protection Mode parameter may take:
- DAP_PLMD_DISABLE_ALL - Audio Regulator and Peak limiter are inactive. Warning in this mode the Audio Processing Platform does not have any peak limiting or headroom to perform it's signal processing. This mode should only be used when external headroom and peak-limiting are provided.
- DAP_PLMD_PEAK_ONLY - Peak Limiter is active and Audio Regulator is in-actve. NB There are some configurations of the Audio Processing platform that can cause signal distortions in this mode. Use this setting with care.
- DAP_PLMD_REGULATED_PEAK - The Peak Limiter and Audio Regulator are both active, however no device specific distortion reduction is being performed.
- DAP_PLMD_REGULATED_DISTORTION - The Peak Limiter and Audio Regulator are both acive. The Audio Regulator is using the device specific distortion threshold information to minimize distortions.
- DAP_PLMD_AUTO - The Peak Limiter and Audio Regulator are always active. The Audio Regulator will be operating in DAP_PLMD_REGULATED_PEAK mode unless the endpoint is DAP_ENDP_INT_SPEAKERS, in which case the Audio Regulator will operate in DAP_PLMD_REGULATED_DISTORTION mode.

Regardless of this setting, the Audio Regulator will not be enabled if it is not part of this SKU.
It is not expected usage to change this parameter between zero and non-zero during the processing of a file. If doing so, the output signal will be subject to some additional attenuation or boosting for a few blocks before returning to normal."""

[[param]]
name = "test"
length = 1
min = 0
max = 1
frac_bits = 0
default = [0]
label = "Peak Limiter Test Mode Enable"
description = "Enable for test mode in the Peak Limiter."
help = "A test mode is provided in the Peak LImiter that removes the system headroom, and hard-clips any peaks on the output, instead of normal limiter operation. This mode is used for system tests. This test mode is active when this parameter is set to DAP_PLIM_TEST_ENABLE, and inactive otherwise. Test mode should only be used in conjunction with the 'plmd' parameter set to DAP_PLMD_PEAK_ONLY."

