length = 1
min = 0
max = 2
frac_bits = 0
default = [0]
label = "Output Channel Format"
description = "Specifies the output channel configuration of the Audio Processing Platform."
help = "Certain configurations may not seem to make sense. E.g.  setting the Output Channel format to DAP_OCF_5DOT1 when Dolby Headphone virtualization is enabled. In these cases the un-used channels will be zero padded."

[[param]]
name = "preg"
length = 1
min = -2080
max = 480
frac_bits = 4
default = [0]
label = "Pre-gain"
description = "The gain applied to the signal prior to entering the Audio Processing Platform."
help = "If the audio entering the Audio Processing Platform is known to have been boosted or attenuated, this parameter should be set to reflect how much gain has been applied."

[[param]]
