[package]
name = "ddp-daemon"
description = "DolbyX daemon: HTTP/WS server + audio-plugin IPC + engine supervision in one binary"
# `gen_param_twin` (dev tool) would otherwise make `cargo run` ambiguous.
default-run = "ddp-daemon"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum.workspace = true
clap.workspace = true
ddp-engine = { path = "../ddp-engine" }
ddp-persistence = { path = "../ddp-persistence" }
ddp-state = { path = "../ddp-state" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
futures-util.workspace = true
# The write-cadence test counts the daemon's atomic replaces (issue #27).
notify.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true

[features]
# Binds the e2e suite (tests/e2e_qemu.rs) to the real engine under
# qemu-arm-static — `just qemu-test` runs it.
qemu = ["ddp-engine/qemu"]
