name: CI

# PR branches run once (pull_request); main runs on push. Without the
# branch filter every PR push fired both events → duplicate checks.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # rustup picks up rust-toolchain.toml (pinned channel + components)
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all --check

  qemu:
    name: qemu (arm shim + probe regressions)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y
          gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user-static
      - run: rustup target add armv7-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ddp-engine-arm --target armv7-unknown-linux-gnueabihf --release
      # Drives the shim (real engine, nothing mocked) over the framed protocol
      - run: cargo test -p ddp-engine --features qemu
      # The daemon e2e suite against the real engine (issue #16)
      - run: cargo test -p ddp-daemon --features qemu
      - run: cargo clippy -p ddp-engine --features qemu --all-targets -- -D warnings
      - run: cargo clippy -p ddp-daemon --features qemu --all-targets -- -D warnings
      # The documented engine behaviors the design load-bears on
      - run: make -C tools/ddp_probe check

  ui:
    name: ui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      # pnpm version comes from ui/package.json's packageManager field
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build

  # Playwright against the real daemon + engine (issue #17) — gated on
  # the unit/integration jobs so it never burns minutes on broken code.
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [rust, qemu, ui]
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y
          gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user-static
      - uses: Swatinem/rust-cache@v2
      - run: scripts/stage-engine.sh target/debug
      - run: cargo build -p ddp-daemon
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ui
      - run: pnpm run e2e
        working-directory: ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
