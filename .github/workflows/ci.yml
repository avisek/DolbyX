name: CI

on:
  push:
  pull_request:

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # rustup picks up rust-toolchain.toml (pinned channel + components)
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all --check

  qemu:
    name: qemu (arm shim + probe regressions)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y
          gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user-static
      - run: rustup target add armv7-unknown-linux-gnueabihf
      - run: cargo build -p ddp-engine-arm --target armv7-unknown-linux-gnueabihf --release
      # Drives the shim (real engine, nothing mocked) over the framed protocol
      - run: cargo test -p ddp-engine --features qemu
      - run: cargo clippy -p ddp-engine --features qemu --all-targets -- -D warnings
      # The documented engine behaviors the design load-bears on
      - run: make -C tools/ddp_probe check

  ui:
    name: ui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      # pnpm version comes from ui/package.json's packageManager field
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
